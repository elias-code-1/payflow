name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: |
          npm run build
          npx electron-builder --win nsis portable --publish never

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: payflow-windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux package formats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder fuse3 lzip rpm
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: |
          npm run build
          npx electron-builder --linux AppImage deb rpm snap flatpak pacman apk freebsd p5p 7z zip tar.xz tar.lz tar.gz tar.bz2 --publish never

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: payflow-linux-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
