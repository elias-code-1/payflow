services:
  - type: web
    name: payflow
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PAYFLOW_DB_PATH
        value: /var/data/payflow.sqlite
      - key: PAYFLOW_BACKUP_DIR
        value: /var/data/backups
      - key: PAYFLOW_AUTO_BACKUPS
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYFLOW_RELEASES_URL
        value: https://github.com/elias-code-1/payflow/releases
      - key: PAYFLOW_EXE_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/PayFlow-Setup-1.0.0.exe
      - key: PAYFLOW_EXE_PORTABLE_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/PayFlow-Portable-1.0.0.exe
      - key: PAYFLOW_APK_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-android.apk
      - key: PAYFLOW_IPA_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/PayFlow-iOS.ipa
      - key: PAYFLOW_LINUX_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/PayFlow-1.0.0.AppImage
      - key: PAYFLOW_APPIMAGE_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/PayFlow-1.0.0.AppImage
      - key: PAYFLOW_DEB_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-1.0.0-amd64.deb
      - key: PAYFLOW_RPM_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-1.0.0-x86_64.rpm
      - key: PAYFLOW_SNAP_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-1.0.0-amd64.snap
      - key: PAYFLOW_FLATPAK_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/PayFlow-1.0.0-x86_64.flatpak
      - key: PAYFLOW_PACMAN_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-1.0.0.pacman
      - key: PAYFLOW_ALPINE_APK_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-alpine-1.0.0.apk
      - key: PAYFLOW_FREEBSD_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-1.0.0.freebsd
      - key: PAYFLOW_ARCHIVE_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-1.0.0.tar.gz
      - key: PAYFLOW_7Z_DOWNLOAD_URL
        value: https://github.com/elias-code-1/payflow/releases/latest/download/payflow-1.0.0.7z
    disk:
      name: payflow-data
      mountPath: /var/data
      sizeGB: 1
