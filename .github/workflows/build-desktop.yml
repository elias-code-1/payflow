name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows packages (direct .exe files, no ZIP)
        run: |
          npm run build
          npx electron-builder --win nsis portable --publish never

      - name: Verify generated EXE files
        shell: bash
        run: ls -lh release/*.exe

      - name: Publish direct EXE files to GitHub Release (no ZIP)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "PayFlow $TAG" --notes "Téléchargements directs PayFlow : chaque fichier (.exe, .AppImage, .deb, .rpm, .apk…) est disponible individuellement sans archive ZIP." --latest || true
          gh release upload "$TAG" release/*.exe --clobber
          {
            echo "### Fichiers Windows disponibles directement (sans ZIP)"
            for f in release/*.exe; do
              bn=$(basename "$f")
              echo "- [$bn](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${bn})"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux package formats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder fuse3 lzip rpm squashfs-tools libarchive-tools xz-utils bzip2 p7zip-full
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Linux packages (direct files, no ZIP)
        run: |
          npm run build
          npx electron-builder --linux AppImage deb rpm snap flatpak pacman apk freebsd 7z tar.xz tar.lz tar.gz tar.bz2 --publish never
          VERSION=$(node -p "require('./package.json').version")
          if [ -f "release/payflow-${VERSION}.apk" ]; then
            mv "release/payflow-${VERSION}.apk" "release/payflow-alpine-${VERSION}.apk"
          fi
          ls -lh release/

      - name: Publish direct Linux files to GitHub Release (no ZIP)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "PayFlow $TAG" --notes "Téléchargements directs PayFlow : chaque fichier (.exe, .AppImage, .deb, .rpm, .apk…) est disponible individuellement sans archive ZIP." --latest || true
          shopt -s nullglob
          FILES=(
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.snap
            release/*.flatpak
            release/*.pacman
            release/*.apk
            release/*.freebsd
            release/*.7z
            release/*.tar.gz
            release/*.tar.xz
            release/*.tar.bz2
            release/*.tar.lz
          )
          gh release upload "$TAG" "${FILES[@]}" --clobber
          {
            echo "### Fichiers Linux & BSD disponibles directement (sans ZIP)"
            for f in "${FILES[@]}"; do
              bn=$(basename "$f")
              echo "- [$bn](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${bn})"
            done
          } >> "$GITHUB_STEP_SUMMARY"
